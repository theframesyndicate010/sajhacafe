<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Sajha Cafe</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #eef3ff 0%, #e2e8f8 45%, #d7dfef 100%);
        color: #0f172a;
        padding: 20px;
      }

      main {
        width: min(520px, 100%);
        border-radius: 18px;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.1);
        padding: 28px 24px;
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.45rem;
        color: #1a3a8f;
      }

      p {
        margin: 0;
        color: #475569;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Sajha Cafe cannot reach the server. Reconnect to continue with live orders, checkout, and bills.</p>
    </main>
  </body>
</html>
